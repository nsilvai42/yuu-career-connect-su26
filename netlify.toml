# Career Connect SU26 — Netlify configuration
[build]
  command = "npm run build"
  publish = "dist"

# Pretty URLs for the static pages
[[redirects]]
  from = "/guide"
  to = "/guide.html"
  status = 200

[[redirects]]
  from = "/guide-pre-registration"
  to = "/guide-pre-registration.html"
  status = 200

[[redirects]]
  from = "/catalog"
  to = "/catalog.html"
  status = 200

[[redirects]]
  from = "/catalog-pre-registration"
  to = "/catalog-pre-registration.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/pre-registration"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/planner"
  to = "/"
  status = 301

# Unlisted pilot: keep the whole site out of search engines.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
