# Career Connect SU26 — Netlify configuration
[build]
  command = "npm run build"
  publish = "dist"

# Pretty URLs for the React planner, guide, and catalog
[[redirects]]
  from = "/guide"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/guide/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/guide.html"
  to = "/guide/"
  status = 301
  force = true

[[redirects]]
  from = "/guide-pre-registration"
  to = "/guide"
  status = 301
  force = true

[[redirects]]
  from = "/guide-registration-open"
  to = "/guide"
  status = 301
  force = true

[[redirects]]
  from = "/catalog"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/catalog/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/catalog.html"
  to = "/catalog/"
  status = 301
  force = true

[[redirects]]
  from = "/catalog-pre-registration"
  to = "/catalog"
  status = 301
  force = true

[[redirects]]
  from = "/catalog-registration-open"
  to = "/catalog"
  status = 301
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/pre-registration"
  to = "/registration-open"
  status = 301
  force = true

[[redirects]]
  from = "/registration-open"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/planner"
  to = "/"
  status = 301

# Stable owned shortlink for the external student portal (updatable in one place)
[[redirects]]
  from = "/portal"
  to = "https://yuprogram.my.site.com/CareerConnect/login"
  status = 301
  force = true

# Unlisted pilot: keep the whole site out of search engines.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
